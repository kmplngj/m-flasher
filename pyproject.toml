[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "m-flasher"
dynamic = ["version"]
description = "Back up, restore and install firmware/bootloaders on the M-VAVE FM-1 and SMK-37 through the chip's USB download mode"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
optional-dependencies = { window = ["pywebview>=5"] }

[project.scripts]
m-flasher = "flasher.__main__:main"

[tool.setuptools]
packages = ["flasher"]

[tool.setuptools.dynamic]
version = { attr = "flasher.__version__" }

[tool.setuptools.package-data]
flasher = ["data/*", "ui/*.html", "ui/*.css", "ui/*.js", "ui/fonts/*"]
