[package]
name = "m-flasher-midi"
version = "0.3.3"
edition = "2024"
license = "MIT"
description = "Small native M-Flasher CLI for explicitly selected Felucca MIDI OTA"

[[bin]]
name = "m-flasher-midi"
path = "../src/midi_main.rs"

[dependencies]
midir-ota = { package = "midir", version = "=0.10.3" }

[features]
default = ["midi"]
midi = []
offline-tests = []
