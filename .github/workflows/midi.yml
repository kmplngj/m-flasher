name: native MIDI CLI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  midi:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, platform: macos }
          - { os: ubuntu-24.04, platform: linux-x86_64 }
          - { os: windows-latest, platform: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-midi-v1-${{ hashFiles('Cargo.lock') }}
      - name: Offline protocol and denying-adapter tests
        run: python3 tools/run_offline_tests.py
      - name: Linux link headers for production compilation (no device access)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libasound2-dev
      - name: Test MIDI CLI with its native adapter compiled out
        run: cargo test --locked -p m-flasher-midi
      - name: Build native MIDI CLI
        if: runner.os != 'macOS'
        run: cargo build --release --locked -p m-flasher-midi
      - name: Build universal macOS MIDI CLI
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --release --locked -p m-flasher-midi --target aarch64-apple-darwin
          cargo build --release --locked -p m-flasher-midi --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create -output target/release/m-flasher-midi target/aarch64-apple-darwin/release/m-flasher-midi target/x86_64-apple-darwin/release/m-flasher-midi
          codesign --force --sign - target/release/m-flasher-midi
      - name: Package and check offline capabilities only
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: python3 tools/package_midi.py
      - uses: actions/upload-artifact@v7
        with:
          name: m-flasher-midi-${{ matrix.platform }}
          path: target/midi-dist/
          if-no-files-found: error
