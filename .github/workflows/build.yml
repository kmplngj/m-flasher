name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest -v

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write             # to publish the release on a tag
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest -v
      - run: pip install pyinstaller==6.11.1
      - name: Build M-Flasher.exe
        run: >
          pyinstaller --onefile --windowed --uac-admin --name M-Flasher
          --add-data "flasher/data;flasher/data" run.py
      - uses: actions/upload-artifact@v7
        with:
          name: M-Flasher-windows
          path: dist/M-Flasher.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/M-Flasher.exe
