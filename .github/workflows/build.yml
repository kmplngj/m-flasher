name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v
      - run: pip install pyinstaller==6.11.1
      - name: Build FM-Flasher.exe
        run: >
          pyinstaller --onefile --windowed --uac-admin --name FM-Flasher
          --add-data "flasher/data;flasher/data" run.py
      - uses: actions/upload-artifact@v4
        with:
          name: FM-Flasher-windows
          path: dist/FM-Flasher.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FM-Flasher.exe
