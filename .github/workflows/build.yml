name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest -v

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write             # to publish the release on a tag
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest -v
      - run: pip install pyinstaller==6.11.1
      - name: Build M-Flasher.exe
        run: >
          pyinstaller --onefile --windowed --uac-admin --name M-Flasher
          --add-data "flasher/data;flasher/data" run.py
      - name: Zip it
        # A zip: browsers warn about downloading a bare unsigned .exe.
        shell: pwsh
        run: |
          $v = python -c "import flasher; print(flasher.__version__)"
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item dist/M-Flasher.exe, windows/README.txt, LICENSE pkg/
          Compress-Archive pkg/* "M-Flasher-$v-windows.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: M-Flasher-windows
          path: M-Flasher-*-windows.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: M-Flasher-*-windows.zip
